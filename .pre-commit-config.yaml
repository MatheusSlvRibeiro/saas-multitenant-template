repos:
  # rev precisa acompanhar a versão de ruff em backend/pyproject.toml — divergir as
  # duas faz o hook formatar diferente do que `ruff format --check` espera no CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      # Único gerenciador de hooks do monorepo (ver README "Hooks locais") — chama
      # lint-staged do frontend em vez de instalar Husky, que disputaria .git/hooks
      # com o pre-commit framework.
      - id: frontend-lint-staged
        name: frontend lint-staged
        entry: pnpm --dir frontend exec lint-staged
        language: system
        pass_filenames: false
        files: ^frontend/

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.16.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
