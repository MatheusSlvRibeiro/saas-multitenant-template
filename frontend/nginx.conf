server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Assets Vite emite com hash no nome (index-XXXX.js) — seguro cachear "para sempre".
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback de SPA: qualquer rota desconhecida cai no index.html, o react-router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
